# data/raw にテキストが追加・更新されたら、自動で取り込んでサイトを更新する。
# ファイル名の決まりは tools/import_changed.sh の先頭に書いてある（<日付>_<店名>[_ポケカ][_p2].txt）。
name: 価格の自動取り込み

on:
  push:
    branches: [claude/site-creation-7inu0t]
    paths: ["data/raw/*.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 追加・更新された元テキストを集める
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            before="HEAD~1"
          fi
          git diff --name-only --diff-filter=AM "$before" HEAD -- 'data/raw/*.txt' | sort > changed.txt || true
          echo "取り込む元テキスト:"; cat changed.txt

      - name: 取り込み・ページ生成・チェック
        run: |
          if [ ! -s changed.txt ]; then echo "新しい元テキストはありません"; exit 0; fi
          xargs -d '\n' tools/import_changed.sh < changed.txt

      - name: 結果をコミットして公開ブランチに戻す
        run: |
          rm -f changed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          names="$(git diff --cached --name-only | grep '^data/raw/' | xargs -n1 basename 2>/dev/null | tr '\n' ' ')"
          git commit -m "Import (auto): ${names}"
          git push
