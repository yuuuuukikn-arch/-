# data/raw にテキストが追加・更新されたら、自動で取り込んでサイトを更新する。
# 何を取り込むかは tools/import_auto.py が data/raw/.imported.json（取り込み済みの記録）と比べて決める。
# 途中の実行が取り消されても、次の実行で残りをまとめて拾う。
name: 価格の自動取り込み

on:
  push:
    branches: [claude/site-creation-7inu0t]
    paths: ["data/raw/*.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公開ブランチの最新に合わせる（前の取り込みの結果の上で作業する）
        run: git pull --rebase origin "${{ github.ref_name }}"

      - name: まだ取り込んでいない元テキストを取り込む → ページ生成 → チェック
        run: python3 tools/import_auto.py

      - name: 結果をコミットして公開ブランチに戻す
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.quotePath=false add -A
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          names="$(git -c core.quotePath=false diff --cached --name-only | grep '^data/raw/' | grep -v '\.imported\.json' | xargs -n1 basename 2>/dev/null | tr '\n' ' ')"
          git commit -m "Import (auto): ${names:-regenerate}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
